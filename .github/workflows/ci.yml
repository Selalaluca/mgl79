name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check Python syntax
        run: uv run --locked python -m compileall -q src

      - name: Build launcher
        run: uv run --locked pyinstaller --noconfirm mgl79.exe.spec

      - name: Build restart loop
        run: uv run --locked pyinstaller --noconfirm mgl79-loop.exe.spec

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: mgl79-${{ github.sha }}
          path: |
            dist/mgl79.exe
            dist/mgl79-loop.exe
