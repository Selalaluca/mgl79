name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check Python syntax
        run: uv run --locked python -m compileall -q src

      - name: Build launcher
        run: uv run --locked pyinstaller --noconfirm launcher.spec

      - name: Build restart loop
        run: uv run --locked pyinstaller --noconfirm loop.spec

      - name: Upload executables
        uses: actions/upload-artifact@v6
        with:
          name: launcher-build-${{ github.sha }}
          path: dist
